[versions]
agp                  = "9.2.1"
kotlin               = "2.3.21"
ksp                  = "2.3.0"
coreKtx              = "1.19.0"
activityCompose      = "1.13.0"
composeBom           = "2026.06.00"
lifecycleVm          = "2.11.0"
navigationCompose    = "2.9.8"
hilt                 = "2.59.2"
hiltNavigation       = "1.3.0"
firebaseBom          = "34.15.0"
coroutines           = "1.11.0"
junit4               = "4.13.2"
junitExt             = "1.3.0"
espressoCore         = "3.7.0"
junitJupiter         = "6.1.0"
mockk                = "1.14.11"
googleServices       = "4.5.0"
constraintlayout = "2.2.1"

[libraries]
androidx-core-ktx              = { group = "androidx.core",           name = "core-ktx",                     version.ref = "coreKtx" }
androidx-activity-compose      = { group = "androidx.activity",       name = "activity-compose",              version.ref = "activityCompose" }
lifecycle-runtime-ktx          = { group = "androidx.lifecycle",      name = "lifecycle-runtime-ktx",         version.ref = "lifecycleVm" }
lifecycle-viewmodel-compose    = { group = "androidx.lifecycle",      name = "lifecycle-viewmodel-compose",   version.ref = "lifecycleVm" }
navigation-compose             = { group = "androidx.navigation",     name = "navigation-compose",            version.ref = "navigationCompose" }

compose-bom                    = { group = "androidx.compose",        name = "compose-bom",                   version.ref = "composeBom" }
compose-ui                     = { group = "androidx.compose.ui",     name = "ui" }
compose-ui-graphics            = { group = "androidx.compose.ui",     name = "ui-graphics" }
compose-ui-tooling-preview     = { group = "androidx.compose.ui",     name = "ui-tooling-preview" }
compose-material3              = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-core    = { group = "androidx.compose.material", name = "material-icons-core" }
compose-ui-tooling             = { group = "androidx.compose.ui",     name = "ui-tooling" }
compose-ui-test-manifest       = { group = "androidx.compose.ui",     name = "ui-test-manifest" }
compose-ui-test-junit4         = { group = "androidx.compose.ui",     name = "ui-test-junit4" }

hilt-android                   = { group = "com.google.dagger",       name = "hilt-android",                  version.ref = "hilt" }
hilt-compiler                  = { group = "com.google.dagger",       name = "hilt-android-compiler",         version.ref = "hilt" }
hilt-navigation-compose        = { group = "androidx.hilt",           name = "hilt-navigation-compose",       version.ref = "hiltNavigation" }

firebase-bom                   = { group = "com.google.firebase",     name = "firebase-bom",                  version.ref = "firebaseBom" }
firebase-firestore             = { group = "com.google.firebase",     name = "firebase-firestore" }
firebase-auth                  = { group = "com.google.firebase",     name = "firebase-auth" }
firebase-storage               = { group = "com.google.firebase",     name = "firebase-storage" }

kotlinx-coroutines-android     = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-android",    version.ref = "coroutines" }
kotlinx-coroutines-test        = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-test",       version.ref = "coroutines" }

junit4                         = { group = "junit",                   name = "junit",                         version.ref = "junit4" }
androidx-junit                 = { group = "androidx.test.ext",       name = "junit",                         version.ref = "junitExt" }
androidx-espresso-core         = { group = "androidx.test.espresso",  name = "espresso-core",                 version.ref = "espressoCore" }
junit-jupiter                  = { group = "org.junit.jupiter",       name = "junit-jupiter",                 version.ref = "junitJupiter" }
mockk                          = { group = "io.mockk",                name = "mockk",                         version.ref = "mockk" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

[plugins]
android-application  = { id = "com.android.application",           version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",      version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                 = { id = "com.google.dagger.hilt.android",    version.ref = "hilt" }
ksp                  = { id = "com.google.devtools.ksp",           version.ref = "ksp" }
google-services      = { id = "com.google.gms.google-services",    version.ref = "googleServices" }
